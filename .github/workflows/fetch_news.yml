name: 뉴스 앤 이슈 - 속보/단독 자동 수집

on:
  schedule:
    # GitHub 예약 실행은 정각(:00)에 몰려 지연·누락이 잦다(뉴스파이널 실측: 30분
    # 간격 설정도 121~136분 만에 실행). 분산을 위해 :00을 피하고 10분 간격으로 잡되,
    # 실제 실행 간격은 이보다 길어질 수 있다는 전제로 아래 중복 실행 가드를 둔다.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions:
  contents: write

# 이전 실행이 아직 안 끝났으면 새 실행은 대기(취소 아님) — 커밋이 겹치지 않게.
concurrency:
  group: newsissue-fetch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 50

      # 스케줄 지연으로 트리거가 몰릴 수 있어, 직전 커밋이 너무 최근이면 건너뛴다.
      - name: 중복 실행 가드 (직전 커밋 후 3분 미만이면 스킵)
        id: guard
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%cI --grep='^Update state$' || true)
          if [ -z "$last" ]; then
            echo "직전 커밋 없음 -> 진행"
            exit 0
          fi
          d=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 60 ))
          echo "직전 커밋: $last (${d}분 전)"
          if [ "$d" -lt 3 ]; then
            echo "3분 이내 -> 이번 실행은 스킵"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Python 설정
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: 속보/단독 수집 및 발송
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/fetch_news.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}

      - name: 상태 커밋 및 푸시
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/state.json
          git diff --staged --quiet || git commit -m "Update state"
          git pull origin main --rebase --strategy-option=theirs || true
          git push --force-with-lease
