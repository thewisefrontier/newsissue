name: 뉴스 앤 이슈 - 속보/단독 자동 수집

on:
  # 실사고(2026-08-18~19): GitHub의 schedule: 트리거는 부하가 몰리면 실행 자체를
  # 지연시킨다(뉴스파이널 실측: 30분 간격 설정도 121~136분 만에 실행). 이 저장소도
  # 08:55 KST 이후 1시간 넘게 실행이 아예 시작조차 안 된 사고가 있었다. 코드로
  # 고칠 수 있는 부분이 아니라서, 외부 크론 핑 서비스(cron-job.org)가 10분마다
  # 이 workflow_dispatch를 정확한 시각에 호출하는 방식으로 교체했다 — schedule:
  # 트리거는 제거(2026-08-19 사용자 결정. 설정 상세는 로컬 NOTES.md 참고).
  workflow_dispatch:

# state.json을 더 이상 저장소에 커밋하지 않는다(캐시로 전환) — 쓰기 권한 불필요.
permissions:
  contents: read

# 이전 실행이 아직 안 끝났으면 새 실행은 대기(취소 아님) — 캐시 저장이 겹치지 않게.
concurrency:
  group: newsissue-fetch
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 잡 전체 강제 타임아웃(기본 360분은 너무 김). 실사고(2026-08-17): Gemini
    # 폴백 체인(모델 5개×키 2개)이 겹치며 8분 넘게 걸려 사용자가 수동으로 중단함.
    # 이후 모든 카테고리(속보 포함)에서 최대 20건까지 크롤링·요약하도록 바뀌어
    # 최악의 경우 더 오래 걸릴 수 있어(건당 최대 33초 × 20건 ≈ 11분) 15분으로
    # 올렸다.
    timeout-minutes: 15
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v5

      # state.json은 이제 git 커밋이 아니라 Actions 캐시로 실행 간에 이어간다.
      # 캐시는 같은 키로 덮어쓸 수 없어서(불변) 저장은 매번 새 키(run_id)로 하고,
      # 복원은 "state-" 접두사로 가장 최근 캐시를 가져온다(restore-keys의 표준 패턴).
      - name: state.json 캐시 복원
        id: cache-restore
        uses: actions/cache/restore@v6
        with:
          path: data/state.json
          key: state-${{ github.run_id }}
          restore-keys: |
            state-

      # 커뮤니티 베스트글 발송 이력(community_state.json)도 같은 방식으로 별도
      # 캐시한다 — 뉴스 state.json과 완전히 분리된 파일이라(2026-08-25, fetch_community.py
      # 참고) 캐시 키도 따로 둔다.
      - name: community_state.json 캐시 복원
        id: community-cache-restore
        uses: actions/cache/restore@v6
        with:
          path: data/community_state.json
          key: community-state-${{ github.run_id }}
          restore-keys: |
            community-state-

      # cron-job.org가 10분마다 정확히 호출하지만, 재시도나 겹침으로 트리거가
      # 몰릴 가능성에 대비해 직전 캐시가 너무 최근이면 건너뛴다. 트리거가
      # schedule에서 workflow_dispatch로 바뀌었으므로 조건도 맞춰 변경(2026-08-19).
      - name: 중복 실행 가드 (직전 발송 후 3분 미만이면 스킵)
        id: guard
        if: github.event_name == 'workflow_dispatch'
        run: |
          last=$(python3 -c "
          import json, sys
          try:
              d = json.load(open('data/state.json'))
              sent = d.get('sent', [])
              print(max(s['sent_at'] for s in sent) if sent else '')
          except Exception:
              print('')
          " 2>/dev/null)
          if [ -z "$last" ]; then
            echo "직전 발송 기록 없음 -> 진행"
            exit 0
          fi
          d=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 60 ))
          echo "직전 발송: $last (${d}분 전)"
          if [ "$d" -lt 3 ]; then
            echo "3분 이내 -> 이번 실행은 스킵"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Python 설정
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 패키지 설치
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: 속보/단독 수집 및 발송
        if: steps.guard.outputs.skip != 'true'
        # 스텝 자체에도 타임아웃을 걸어, 파이썬 쪽 시간 예산 로직이 뚫리는 경우를 대비한다.
        timeout-minutes: 12
        run: python scripts/fetch_news.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          # 실사고(2026-08-20) 대응 — 중복판정 결정 이력을 Cloudflare D1에 남겨서
          # 디버깅한다. 시크릿 미설정 시 log_decision()이 조용히 no-op(발송은 안 막힘).
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: 커뮤니티 베스트글 수집 및 발송
        if: steps.guard.outputs.skip != 'true'
        # 목록 페이지 7곳 순차 요청 + 발송 직전 후보만 크롤링·Gemini 검사
        # (fetch_community.py 옆 주석 참고, 2026-08-25 크롤링·요약 추가로
        # 아래 GEMINI 키도 같이 필요해짐). 이 스텝 자체는 이 워크플로와 동일하게
        # 10분마다 실행되지만, 커뮤글은 뉴스와 달리 "먼저 알리는 게 가치"가
        # 아니라는 사용자 지적(2026-08-25)으로 fetch_community.py 안에서 자체
        # 가드를 둬 실제로는 COMMUNITY_CHECK_INTERVAL_MIN(60분)마다만 일하고
        # 나머지 실행에서는 네트워크 요청 없이 바로 스킵한다 — 그래서 대부분의
        # 실행에서 이 스텝은 몇 초 안에 "[SKIP]"만 찍고 끝난다.
        timeout-minutes: 5
        run: python scripts/fetch_community.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # 실사고(2026-08-25): 이 env가 빠져 있어서 summarize_and_check()의
          # 2차 위험판정(Gemini)이 운영에서 매번 즉시 fail-open됐다 — 크롤링·
          # 요약을 추가하면서 이 스텝의 env 갱신을 놓쳤다. 키워드 1차 필터만
          # 유일한 방어선이었던 게 "후방)" 같은 축약 태그를 못 잡은 그날 사고의
          # 진짜 원인. fetch_news.py 스텝과 같은 키를 그대로 쓴다(쿼터 공유,
          # fetch_community.py 상단 docstring 참고).
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}

      - name: state.json 캐시 저장
        # 위 스텝이 타임아웃/실패로 중단돼도 그때까지 처리된 상태는 저장한다.
        if: steps.guard.outputs.skip != 'true' && always()
        uses: actions/cache/save@v6
        with:
          path: data/state.json
          key: state-${{ github.run_id }}

      - name: community_state.json 캐시 저장
        if: steps.guard.outputs.skip != 'true' && always()
        uses: actions/cache/save@v6
        with:
          path: data/community_state.json
          key: community-state-${{ github.run_id }}
